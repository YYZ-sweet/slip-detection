# configs/freq_manual.yaml
# 纯时域 GRU + 手工固定频带能量 —— 你的核心创新点之一
#
# 原理：对 60 帧窗口做 rFFT，按 [0,5,15,40,90] Hz 切 4 个频带，
#       每个频带对 54 个通道各算一个能量，沿时间维广播后拼到原特征后面。
#       特征维度 54 → 54 + 4×54 = 270。
#
# 跑法：
#   python src/preprocess.py --data_dir ./data_raw            # 无 SMOTE 版
#   python src/train.py --config configs/freq_manual.yaml

experiment:
  name: freq_manual_GRU
  tags: [freq, manual, handcrafted, ce]

data:
  processed_dir: ./processed_data
  freq:
    enabled: true
    mode: manual
    edges_hz: [0.0, 5.0, 15.0, 40.0, 90.0]   # 4 个频带
    fs: 180.0

model:
  type: GRU
  input_size: 54                    # 会被 train.py 自动改成 270
  hidden_size: 64
  num_layers: 1
  bidirectional: false
  dropout: 0.3
  num_classes: 2

train:
  lr: 0.003
  batch_size: 256
  epochs: 30
  early_stop_patience: 7
  seed: 42
  device: auto
  loss: ce
  class_weight: false

eval:
  batch_size: 1024
  tune_threshold: true
  min_f1_ratio: 0.95

output:
  results_dir: ./experiments
