# configs/baseline.yaml
# 纯时域 GRU，无 SMOTE，无频带 — 等价于你暑假「入门小任务」的版本

experiment:
  name: baseline_GRU_no_smote
  tags: [baseline, no_smote, no_freq, GRU]

data:
  processed_dir: ./processed_data
  train_npz: train.npz
  val_npz: val.npz
  test_npz: test.npz
  norm_params: norm_params.npz

model:
  type: GRU                  # GRU / LSTM
  input_size: 54             # 18 pins × 3 axes
  hidden_size: 64
  num_layers: 1
  bidirectional: false
  dropout: 0.3
  num_classes: 2
  # 频带特征：baseline 不启用
  freq:
    enabled: false
    mode: null               # manual / learnable

train:
  lr: 0.003
  batch_size: 256
  epochs: 30
  early_stop_patience: 7
  seed: 42
  device: auto              # auto / cuda / cpu
  # 类别不平衡处理：baseline 不启用
  class_balance:
    smote: false
    class_weight: false
    focal_loss: false

eval:
  batch_size: 1024
  tune_threshold: true       # 是否在验证集上调阈值
  min_f1_ratio: 0.95         # 阈值调优时 F1 不能低于最优的多少倍

output:
  results_dir: ./experiments/${experiment.name}