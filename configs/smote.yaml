# configs/smote.yaml
# 纯时域 GRU + 训练集 SMOTE —— 对照组 2
#
# SMOTE 在【预处理阶段】完成（只对训练集），所以：
#   1. 先用 SMOTE 重新生成数据：
#        python src/preprocess.py --data_dir ./data_raw --use_smote --output_dir ./processed_data_smote
#   2. 再训练：
#        python src/train.py --config configs/smote.yaml
#
# 为什么 SMOTE 不放在训练循环里？
#   放在预处理阶段 = 数据固定、可复现、易对比；
#   放在训练里 = 每个 epoch 重新合成，反而难以复现。

experiment:
  name: smote_GRU
  tags: [smote, no_freq, ce]

data:
  processed_dir: ./processed_data_smote     # 指向 SMOTE 版数据
  freq:
    enabled: false
    mode: none

model:
  type: GRU
  input_size: 54
  hidden_size: 64
  num_layers: 1
  bidirectional: false
  dropout: 0.3
  num_classes: 2

train:
  lr: 0.003
  batch_size: 256
  epochs: 30
  early_stop_patience: 7
  seed: 42
  device: auto
  loss: ce
  class_weight: false

eval:
  batch_size: 1024
  tune_threshold: true
  min_f1_ratio: 0.95

output:
  results_dir: ./experiments
